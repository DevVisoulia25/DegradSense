name: Verify project

on: [push, pull_request]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install verified dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  cloud-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deployment/requirements.txt
      - name: Install cloud runtime and test runner
        run: python -m pip install -r deployment/requirements.txt pytest==9.1.1
      - name: Verify packaged dashboard and inference on Linux
        run: python -m pytest -q -p no:cacheprovider tests/test_deployment.py
